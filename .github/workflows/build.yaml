name: build

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SINGBOX_VERSION: 1.13.16
  MIHOMO_VERSION: v1.19.29

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install domain-list-community
        run: go install github.com/v2fly/domain-list-community@20260807044359

      - name: Install sing-box
        run: |
          url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --retry 3 "$url" -o sing-box.tar.gz
          tar xzf sing-box.tar.gz --strip-components=1 -C /usr/local/bin "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box"
          sing-box version

      - name: Install mihomo
        run: |
          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          curl -fsSL --retry 3 "$url" -o mihomo.gz
          gunzip -c mihomo.gz > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          mihomo -v

      - name: Build geosite.dat
        run: domain-list-community -datapath ./data -outputname geosite.dat -outputdir ./output -exportlists category-ads,category-finance,category-gov,category-media,category-medicine,category-public-dns,category-shopping,category-telecom,category-transport,category-video,other,ozon,vk,wildberries,x5,yandex,private,whitelist

      - name: Sanity check
        working-directory: output
        run: |
          test -s geosite.dat
          test "$(stat -c %s geosite.dat)" -ge 5000

      - name: Generate rule sets
        run: python3 .github/scripts/rulesets.py output output

      - name: Compile rule sets
        working-directory: output
        run: |
          set -euo pipefail
          for src in *.srs.json; do
            sing-box rule-set compile --output "${src%.srs.json}.srs" "$src"
          done
          for src in *.mrs.txt; do
            mihomo convert-ruleset domain text "$src" "${src%.mrs.txt}.mrs"
          done
          rm -f *.srs.json *.mrs.txt
          rm -f *.txt

      - name: Checksum
        working-directory: output
        run: |
          sha256sum geosite.dat | tee geosite.dat.sha256sum
          sha256sum geosite.dat | cut -d' ' -f1 > geosite.dat.sha256

      - name: Changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.run_number }}
        run: |
          set -euo pipefail
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git fetch --no-tags --depth=1 origin "refs/tags/$prev:refs/tags/$prev"
            base="$prev"
          else
            base=$(git hash-object -t tree /dev/null)
          fi
          python3 .github/scripts/changes.py changelog "$base" > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: geosite
          path: |
            output/
            notes.md
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geosite

      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.run_number }}
          name: ${{ github.run_number }}
          draft: true
          body_path: notes.md
          files: output/*

      - name: Verify assets
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in output/*; do
            base=$(basename "$f")
            echo "$names" | grep -qx "$base" || { echo "missing asset: $base" >&2; exit 1; }
          done

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest
